
name: Build Crystal Talent APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'CrystalTalent-Android-Source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source ZIP
        run: |
          set -euo pipefail
          ZIP="$GITHUB_WORKSPACE/CrystalTalent-Android-Source.zip"
          test -f "$ZIP" || {
            echo "Crystal Talent source ZIP missing"
            exit 1
          }
          unzip -t "$ZIP"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/crystal-talent"
          mkdir -p "$DEST"
          unzip -oq "$GITHUB_WORKSPACE/CrystalTalent-Android-Source.zip" -d "$DEST"
          test -f "$DEST/settings.gradle"
          test -f "$DEST/app/build.gradle"

      - name: Build APK
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace \
            -p "$RUNNER_TEMP/crystal-talent" \
            :app:assembleDebug

      - name: Prepare APK
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/crystal-talent/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK" || {
            find "$RUNNER_TEMP/crystal-talent/app/build/outputs" -type f
            exit 1
          }
          mkdir -p artifacts
          cp "$APK" artifacts/Crystal-Talent-debug.apk
          ls -lh artifacts/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Crystal-Talent-APK
          path: artifacts/Crystal-Talent-debug.apk
          if-no-files-found: error
          retention-days: 14
          
